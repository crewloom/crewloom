<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Crewloom Computer Use</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="sidepanel-root">
    <!-- Top Header -->
    <header class="sp-header">
      <div class="sp-brand">
        <img src="icons/icon-32.png" alt="Crewloom Logo" class="sp-logo">
        <div class="sp-brand-meta">
          <span class="sp-title">Crewloom</span>
          <span class="sp-badge">Computer Use</span>
        </div>
      </div>
      <div class="sp-header-controls">
        <span class="daemon-pill" id="daemonPill">
          <span class="pill-dot"></span>
          <span id="daemonLabel">Active</span>
        </span>
        <button id="langToggle" class="btn-ghost" title="Switch Language">العربية</button>
      </div>
    </header>

    <label><input type="checkbox" id="companionEnabled"> Browser companion / إضافة المتصفح</label>

    <!-- Active Tab Banner -->
    <section class="tab-banner" id="tabBanner">
      <div class="tab-info">
        <span class="tab-favicon">🌐</span>
        <div class="tab-details">
          <span class="tab-title" id="tabTitle">Loading active tab...</span>
          <span class="tab-url" id="tabUrl">—</span>
        </div>
      </div>
      <button id="refreshTabBtn" class="btn-icon" title="Refresh Tab State">↻</button>
    </section>

    <!-- 4 Primary Computer Use Action Tools -->
    <section class="tools-grid">
      <button id="indexBtn" class="tool-card tool-primary">
        <span class="tool-icon">⚡</span>
        <div class="tool-text">
          <span class="tool-name">Auto-Index Page</span>
          <span class="tool-sub">Number buttons [1], [2]...</span>
        </div>
      </button>

      <button id="captureBtn" class="tool-card">
        <span class="tool-icon">📸</span>
        <div class="tool-text">
          <span class="tool-name">Vision Capture</span>
          <span class="tool-sub">Capture tab screenshot</span>
        </div>
      </button>

      <button id="inspectBtn" class="tool-card">
        <span class="tool-icon">🎯</span>
        <div class="tool-text">
          <span class="tool-name">Hover Inspector</span>
          <span class="tool-sub">Inspect DOM elements</span>
        </div>
      </button>

      <button id="clearBtn" class="tool-card">
        <span class="tool-icon">🧹</span>
        <div class="tool-text">
          <span class="tool-name">Clear Overlays</span>
          <span class="tool-sub">Remove in-page tags</span>
        </div>
      </button>
    </section>

    <!-- Visual Vision Viewport (Screenshot Preview) -->
    <section class="vision-section" id="visionSection">
      <div class="section-header">
        <span class="section-title">Visual Vision Frame</span>
        <span class="frame-meta" id="frameMeta">No capture yet</span>
      </div>
      <div class="vision-viewport" id="visionViewport">
        <div class="vision-empty" id="visionEmpty">
          <span>Click "Vision Capture" to stream the visual tab state for the AI agent.</span>
        </div>
        <img id="visionImg" class="vision-img hidden" alt="Visual Frame Preview">
      </div>
    </section>

    <!-- Direct Element Command & Quick Click -->
    <section class="command-section">
      <div class="command-box">
        <input type="number" id="elementInput" placeholder="Element # (e.g. 1)" min="1">
        <button id="clickElementBtn" class="btn-accent">Execute Click</button>
      </div>
    </section>

    <!-- Indexed Elements Directory -->
    <section class="directory-section">
      <div class="section-header">
        <span class="section-title">Interactive Elements</span>
        <span class="element-count-badge" id="elemCountBadge">0</span>
      </div>
      <div class="directory-list" id="directoryList">
        <div class="directory-empty">Click "Auto-Index Page" to detect interactive elements.</div>
      </div>
    </section>

    <!-- Live Execution Console / Terminal Log -->
    <section class="terminal-section">
      <div class="section-header">
        <span class="section-title">Agent Execution Stream</span>
        <button id="clearConsoleBtn" class="btn-ghost-sm">Clear</button>
      </div>
      <div class="terminal-body" id="terminalLogs"></div>
    </section>

    <!-- Bottom macOS System Permissions Bar -->
    <footer class="sp-footer">
      <div class="perm-badges">
        <span class="perm-pill" id="permAcc">🖥️ Accessibility</span>
        <span class="perm-pill" id="permScreen">📸 Screen Capture</span>
      </div>
      <button id="openMacSettingsBtn" class="btn-link">macOS Settings ↗</button>
    </footer>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
